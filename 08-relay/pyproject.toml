[project]
name = "relay"
version = "0.1.0"
description = "A fault-tolerant workflow engine with a live operations dashboard (portfolio project)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

# Not an installable package: commands run from the repository root
# (python -m services.worker, alembic, pytest) with the root on sys.path.
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "e2e: starts API, CRM and worker as real subprocesses",
    "fault_injection: kills, freezes or fault-injects real worker and CRM processes",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"migrations/*/versions/*.py" = ["E501"]

[tool.ruff.format]
exclude = ["migrations/*/versions/*.py"]

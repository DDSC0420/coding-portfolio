# Two independent migration environments, one per database:
#   uv run alembic -n engine upgrade head
#   uv run alembic -n crm upgrade head
# Database URLs come from RELAY_DATABASE_URL / CRM_DATABASE_URL (see .env.example).

[engine]
script_location = %(here)s/migrations/engine
prepend_sys_path = .
path_separator = os

[crm]
script_location = %(here)s/migrations/crm
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

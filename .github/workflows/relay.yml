name: relay

on:
  push:
    paths: ["08-relay/**", ".github/workflows/relay.yml"]
  pull_request:
    paths: ["08-relay/**", ".github/workflows/relay.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: 08-relay

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay_engine
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U relay" --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      RELAY_TEST_ADMIN_URL: postgresql+psycopg://relay:relay@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Tests (real PostgreSQL; crash tests kill and freeze real worker processes)
        run: uv run pytest

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay_engine
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U relay" --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      RELAY_TEST_ADMIN_URL: postgresql+psycopg://relay:relay@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: 08-relay/web/package-lock.json
      - run: uv sync --frozen
      - run: npm ci
        working-directory: 08-relay/web
      - run: npx playwright install --with-deps chromium
        working-directory: 08-relay/web
      - name: UI tests (real API, CRM and two workers; one worker is killed mid-batch)
        run: npm test
        working-directory: 08-relay/web
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: relay-ui-results
          path: 08-relay/web/test-results/
          if-no-files-found: ignore

  compose-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Start the whole stack in Docker (2 databases, API, CRM, 2 workers, dashboard)
        run: docker compose -f compose.yaml -f compose.demo.yaml up -d --build --wait
      - name: The dashboard is served and reaches the API through nginx
        run: |
          curl -fsS http://127.0.0.1:8080/ | grep -q "RELAY operations"
          curl -fsS http://127.0.0.1:8080/api/overview | grep -q '"lease_seconds":8'
      - name: "Demo: unreliable CRM, kill worker-a mid-batch with docker compose kill, approvals, then verify both databases"
        run: uv run python scripts/demo.py
      - name: Benchmark (small; also checks nothing was lost or doubled)
        run: uv run python scripts/benchmark.py --workflows 200 --workers 1 2
      - name: Logs
        if: failure()
        run: docker compose -f compose.yaml -f compose.demo.yaml logs --tail 200

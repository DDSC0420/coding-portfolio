name: relay

on:
  push:
    paths: ["08-relay/**", ".github/workflows/relay.yml"]
  pull_request:
    paths: ["08-relay/**", ".github/workflows/relay.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: 08-relay

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay_engine
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U relay" --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      RELAY_TEST_ADMIN_URL: postgresql+psycopg://relay:relay@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Tests (real PostgreSQL; crash tests kill and freeze real worker processes)
        run: uv run pytest

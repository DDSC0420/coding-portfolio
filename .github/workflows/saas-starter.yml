name: saas-starter

on:
  push:
    paths: ["05-saas-starter/**", ".github/workflows/saas-starter.yml"]
  pull_request:
    paths: ["05-saas-starter/**", ".github/workflows/saas-starter.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: 05-saas-starter

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 05-saas-starter/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m playwright install --with-deps chromium
      - run: pytest
      - name: The app starts from the README command and serves its pages
        run: |
          python -m tally serve --port 8765 --db /tmp/tally.db &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/ | grep -q "Projects, tallied."
          curl -fsS -o /dev/null -w "%{http_code}\n" http://127.0.0.1:8765/app | grep -q 303

name: uk-grid-pipeline

on:
  push:
    paths: ["02-uk-grid-pipeline/**", ".github/workflows/uk-grid-pipeline.yml"]
  pull_request:
    paths: ["02-uk-grid-pipeline/**", ".github/workflows/uk-grid-pipeline.yml"]
  workflow_dispatch:
    inputs:
      days:
        description: "Days of live data to fetch"
        default: "14"
      snapshot:
        description: "Commit the fetched data as the bundled sample (true/false)"
        default: "false"

permissions:
  contents: read

defaults:
  run:
    working-directory: 02-uk-grid-pipeline

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 02-uk-grid-pipeline/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m playwright install --with-deps chromium
      - run: pytest

  # Manual run against the real API: proves the live path works end to end.
  live:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m gridwatch run --days "$DAYS" --save-raw raw
        env:
          DAYS: ${{ inputs.days }}
      - uses: actions/upload-artifact@v6
        with:
          name: live-run
          path: |
            02-uk-grid-pipeline/raw
            02-uk-grid-pipeline/site
      - name: Commit the fetched data as the bundled sample
        if: inputs.snapshot == 'true'
        run: |
          cp raw/intensity.json raw/generation.json sample/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sample
          git commit -m "Refresh bundled sample from the live API" && git push

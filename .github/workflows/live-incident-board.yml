name: live-incident-board

on:
  push:
    paths: ["01-live-incident-board/**", ".github/workflows/live-incident-board.yml"]
  pull_request:
    paths: ["01-live-incident-board/**", ".github/workflows/live-incident-board.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 01-live-incident-board
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 01-live-incident-board/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m playwright install --with-deps chromium
      - run: pytest

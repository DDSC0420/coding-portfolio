name: intake

on:
  push:
    paths: ["03-intake/**", ".github/workflows/intake.yml"]
  pull_request:
    paths: ["03-intake/**", ".github/workflows/intake.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: 03-intake

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 03-intake/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m playwright install --with-deps chromium
      - run: pytest
      - name: Scorecard against the hand-labelled samples
        run: python -m intake eval

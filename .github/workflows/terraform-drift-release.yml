name: terraform-drift-release

# Publish a GitHub Release with the wheel and sdist attached. Two ways to start it:
#   - push a tag like drift-v0.1.0, or
#   - Actions tab -> terraform-drift-release -> Run workflow (tags main with the package version).
# No PyPI: that needs the owner's PyPI account. Trusted Publishing would be the way.
on:
  push:
    tags: ["drift-v*"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: 04-terraform-drift
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Work out the tag, and refuse a mismatch or a repeat
        id: version
        run: |
          version="$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' src/plandrift/__init__.py)"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tag="$GITHUB_REF_NAME"; else tag="drift-v$version"; fi
          test "${tag#drift-v}" = "$version" || { echo "tag $tag doesn't match package version $version"; exit 1; }
          grep -q "^## $version " CHANGELOG.md || { echo "CHANGELOG.md has no entry for $version"; exit 1; }
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag is already released: bump the version in src/plandrift/__init__.py and CHANGELOG.md"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: pip install -r requirements-dev.txt -e .
      - run: pytest
      - run: python -m build && twine check --strict dist/*
      - name: Smoke test the built wheel
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl
          test "$(/tmp/v/bin/plandrift --version)" = "plandrift $VERSION"
      - name: Release notes from the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: awk -v v="$VERSION" '$0 ~ "^## "v" " {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
      - name: Create the GitHub Release (and the tag, when started from the Actions tab)
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "plandrift $VERSION" \
            --notes-file notes.md \
            --repo "$GITHUB_REPOSITORY"

  # Install from the published release, the way a user would, on each OS.
  verify:
    needs: release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: ${{ github.workspace }}
        shell: bash
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip install from the release URL
        env:
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/plandrift-$VERSION-py3-none-any.whl"
          python -m pip install "$url"
          test "$(plandrift --version | tr -d '\r')" = "plandrift $VERSION"

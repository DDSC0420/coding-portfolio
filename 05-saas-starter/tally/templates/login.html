{% extends "base.html" %}
{% block title %}Sign in · Tally{% endblock %}
{% block width %}narrow{% endblock %}
{% block body %}
<h1>Sign in</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login" class="stack">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <input type="hidden" name="next" value="{{ next }}">
  <label>Email <input type="email" name="email" autocomplete="email" required value="{{ email }}"></label>
  <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
  <button class="btn">Sign in</button>
</form>
<p class="muted"><a href="/forgot">Forgot your password?</a> · <a href="/signup">Create an account</a></p>
{% endblock %}

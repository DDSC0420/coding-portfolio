<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pocket Links · mini golf</title>
  <meta name="description" content="Nine holes of mini golf in the browser, on a deterministic physics engine.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%233d9a4b'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body data-phase="loading">
  <header class="hud" aria-label="Score">
    <div class="hole-info">
      <span class="label">Hole</span> <strong id="hole-number">1</strong><span class="of">/9</span>
      <span class="name" id="hole-name"></span>
      <span class="par">Par <strong id="hole-par"></strong></span>
    </div>
    <div class="scores">
      <span class="label">Strokes</span> <strong id="strokes">0</strong>
      <span class="label total">Total</span> <strong id="total">E</strong>
    </div>
    <div class="buttons">
      <button type="button" id="mute" aria-pressed="false" title="Sound on or off">Sound: on</button>
    </div>
  </header>

  <main class="stage">
    <canvas id="course" width="960" height="600" aria-label="The course. Drag back from the ball to aim and set power, then let go. Or use the arrow keys and Space." tabindex="0"></canvas>

    <section class="card" id="hole-done" hidden aria-live="assertive">
      <p class="verdict" id="verdict"></p>
      <p class="detail" id="verdict-detail"></p>
      <button type="button" id="next" class="primary">Next hole</button>
    </section>

    <section class="card scorecard" id="round-done" hidden aria-live="assertive">
      <h2>Round complete</h2>
      <table id="card"></table>
      <p class="detail" id="best"></p>
      <button type="button" id="again" class="primary">Play again</button>
    </section>
  </main>

  <footer class="help">
    <p id="aim-readout" aria-live="polite">Aim 0° · Power 50%</p>
    <p class="keys"><b>Drag back</b> from the ball and let go to putt · <kbd>←</kbd><kbd>→</kbd> aim (<kbd>Shift</kbd> for 10°) · <kbd>↑</kbd><kbd>↓</kbd> power · <kbd>Space</kbd> putt</p>
  </footer>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
